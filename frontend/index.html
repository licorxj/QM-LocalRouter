<!DOCTYPE html>
<html lang="zh-CN" >
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply persisted theme before first paint (dark is the brand default).
      (function () {
        try {
          var t = localStorage.getItem("app-theme") || "dark";
          var dark =
            t === "dark" ||
            (t === "system" && !window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalRouter - 你的api路由管家</title>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
