name: Build Release (Windows / macOS / Linux)

# Build native single-file executables for the three desktop platforms and
# attach them to a GitHub Release when a version tag (v*) is pushed.
#
# NOTE ON PLUGINS: plugins are NOT shipped in these release assets. They are
# downloaded on demand by the app from the COS plugin catalog (index.json) at
# runtime. In particular the compiled `opencode2api` gateway binary is never
# bundled here. The staging steps below copy only the app executable, frontend
# dist, run scripts and .env.example; they intentionally exclude any
# data/plugins or data/script_plugins content. A verification step asserts no
# plugin artifacts slipped into the staged package.
#
# NOTE ON WINDOWS: the Windows installer (exe) is built locally by the
# maintainer and uploaded to the Release manually with `gh release upload`.
# This workflow intentionally builds only Linux and macOS to avoid duplicate
# Windows assets with the same filename.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: apirouter-linux
          - os: macos-latest
            asset: apirouter-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-build.txt
          pip install pillow  # installer icon (logo.png -> app.ico), optional locally
        shell: bash

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        shell: bash

      - name: Generate version metadata
        run: |
          TAG=$(git describe --tags --always 2>/dev/null || echo "")
          COMMIT=$(git rev-parse --short HEAD)
          if [ -n "$(git status --porcelain)" ]; then DIRTY=true; else DIRTY=false; fi
          cat > version.json <<EOF
          {
            "git_tag": "$TAG",
            "git_commit": "$COMMIT",
            "git_dirty": $DIRTY
          }
          EOF
          echo "Built version: $TAG ($COMMIT, dirty=$DIRTY)"
        shell: bash

      - name: Build executable with PyInstaller
        run: pyinstaller build_pyinstaller.spec --noconfirm --clean
        shell: bash

      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        run: |
          ASSET="${{ matrix.asset }}"
          STAGE="release-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp "dist/apirouter" "$STAGE/apirouter"
          chmod +x "$STAGE/apirouter"
          cp "release/run.sh" "$STAGE/run.sh"
          chmod +x "$STAGE/run.sh"
          if [ -d frontend/dist ]; then
            mkdir -p "$STAGE/frontend"
            cp -r frontend/dist "$STAGE/frontend/dist"
          fi
          # 静态模板 JSON（热门平台列表）：exe 旁 data/ 可编辑，内置 _MEIPASS
          # 也有一份打包副本用于回退，避免「热门平台」弹窗为空。
          mkdir -p "$STAGE/data"
          cp backend/data/hot_providers.json "$STAGE/data/hot_providers.json"
          [ -f .env.example ] && cp .env.example "$STAGE/.env.example"
          ( cd "$STAGE" && zip -r "../$ASSET.zip" . )
        shell: bash

      # Reuses the frontend/dist and dist/{apirouter,LocalRouter} built above
      # (--skip-frontend --skip-backend), assembles LocalRouter.app and
      # compiles the per-user .pkg installer. Version comes from the pushed
      # v* tag via git describe.
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-installer.sh --skip-frontend --skip-backend
        shell: bash

      - name: Upload installer artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: apirouter-macos-installer
          path: dist/installer/*.pkg
          if-no-files-found: error
          retention-days: 7

      # Plugins are intentionally excluded from release packages; users fetch
      # them on demand from the COS catalog. Fail the build if any plugin
      # artifacts slipped in, so a future change cannot silently bundle the
      # compiled gateway binary (or any other plugin) into a GitHub asset.
      - name: Verify no plugins in release package (Unix)
        if: runner.os != 'Windows'
        run: |
          ASSET="${{ matrix.asset }}"
          # Match plugin artifact PATHS/FILENAMES only (anchored), not bare
          # keywords: the frontend bundle legitimately mentions "opencode2api"
          # in UI copy, which must not fail this check.
          BAD=$(unzip -Z1 "$ASSET.zip" | grep -Ei '(^|/)(script_plugins|plugins)/|(^|/)opencode2api(\.exe)?$|(^|/)(installed\.json|audit\.jsonl|manifest\.json)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Plugin artifacts found in $ASSET.zip:"
            echo "$BAD"
            exit 1
          fi
          echo "Verified: $ASSET.zip contains no plugin artifacts"
        shell: bash

      # Both platform jobs run in parallel, so they must NOT create/publish
      # the Release themselves: whichever finishes first would publish an
      # immutable Release and the others would fail to upload their assets.
      # Each job only uploads its zip as a workflow artifact; the single
      # `release` job below creates the Release once with all assets attached.
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Stage GitHub Release (draft)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: packages

      # Create the release as a DRAFT on purpose:
      #  1. The Windows installer is built locally by the maintainer and must be
      #     appended with `gh release upload <tag> <exe>` before publishing.
      #  2. Repositories with "immutable releases" enabled permanently lock a
      #     tag once its release is published, so publishing here would block
      #     the local Windows upload (and any later fix) for that tag.
      # After uploading the Windows exe manually, publish with:
      #   gh release edit <tag> --draft=false
      - name: Create DRAFT release and attach CI assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            packages/*/*.zip
            packages/*/*.pkg
          # Windows .exe installer is uploaded separately by the maintainer
          # (built locally); do not fail when no CI-built exe exists.
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
