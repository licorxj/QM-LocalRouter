name: Build Release (Windows / macOS / Linux)

# Build native single-file executables for the three desktop platforms and
# attach them to a GitHub Release when a version tag (v*) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: apirouter-linux
          - os: macos-latest
            asset: apirouter-macos
          - os: windows-latest
            asset: apirouter-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-build.txt
          pip install pillow  # installer icon (logo.png -> app.ico), optional locally
        shell: bash

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        shell: bash

      - name: Generate version metadata
        run: |
          TAG=$(git describe --tags --always 2>/dev/null || echo "")
          COMMIT=$(git rev-parse --short HEAD)
          if [ -n "$(git status --porcelain)" ]; then DIRTY=true; else DIRTY=false; fi
          cat > version.json <<EOF
          {
            "git_tag": "$TAG",
            "git_commit": "$COMMIT",
            "git_dirty": $DIRTY
          }
          EOF
          echo "Built version: $TAG ($COMMIT, dirty=$DIRTY)"
        shell: bash

      - name: Build executable with PyInstaller
        run: pyinstaller build_pyinstaller.spec --noconfirm --clean
        shell: bash

      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        run: |
          ASSET="${{ matrix.asset }}"
          STAGE="release-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp "dist/apirouter" "$STAGE/apirouter"
          chmod +x "$STAGE/apirouter"
          cp "release/run.sh" "$STAGE/run.sh"
          chmod +x "$STAGE/run.sh"
          if [ -d frontend/dist ]; then
            mkdir -p "$STAGE/frontend"
            cp -r frontend/dist "$STAGE/frontend/dist"
          fi
          [ -f .env.example ] && cp .env.example "$STAGE/.env.example"
          ( cd "$STAGE" && zip -r "../$ASSET.zip" . )
        shell: bash

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        run: |
          $asset = "${{ matrix.asset }}"
          $stage = "release-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/apirouter.exe" "$stage/apirouter.exe"
          Copy-Item "release/run.bat" "$stage/run.bat"
          if (Test-Path "frontend/dist") { Copy-Item -Recurse "frontend/dist" "$stage/frontend/dist" }
          if (Test-Path ".env.example") { Copy-Item ".env.example" "$stage/.env.example" }
          Compress-Archive -Path "$stage/*" -DestinationPath "$asset.zip" -Force
        shell: pwsh

      # Reuses the frontend/dist and dist/apirouter.exe built above
      # (-SkipFrontend -SkipBackend) and stages + compiles the Inno Setup
      # installer. Version comes from the pushed v* tag via git describe.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: scripts/build-windows-installer.ps1 -SkipFrontend -SkipBackend
        shell: pwsh

      - name: Upload installer artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: apirouter-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 7

      # Reuses the frontend/dist and dist/{apirouter,LocalRouter} built above
      # (--skip-frontend --skip-backend), assembles LocalRouter.app and
      # compiles the per-user .pkg installer. Version comes from the pushed
      # v* tag via git describe.
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-installer.sh --skip-frontend --skip-backend
        shell: bash

      - name: Upload installer artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: apirouter-macos-installer
          path: dist/installer/*.pkg
          if-no-files-found: error
          retention-days: 7

      # The three platform jobs run in parallel, so they must NOT create/publish
      # the Release themselves: whichever finishes first would publish an
      # immutable Release and the others would fail to upload their assets.
      # Each job only uploads its zip as a workflow artifact; the single
      # `release` job below creates the Release once with all assets attached.
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Create release and attach every asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*/*.zip
            packages/*/*.exe
            packages/*/*.pkg
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
