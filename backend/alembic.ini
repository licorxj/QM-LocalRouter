[alembic]
# 迁移脚本目录（database.py 中会用绝对路径覆盖，这里的值供命令行使用）
script_location = alembic
# 让命令行能 import app 包（在 backend 目录下运行）
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url 留空：env.py 会从 app.config.settings.DATABASE_URL 动态读取，
# 并把 sqlite+aiosqlite 驱动替换为同步 sqlite 驱动供迁移使用。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
